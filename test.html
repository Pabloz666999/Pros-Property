<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pakar Ekstrakurikuler - Forward Chaining</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 30px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 500px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    .question {
      margin: 20px 0;
      font-size: 18px;
      font-weight: bold;
    }
    button {
      margin: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }
    button.yes { background: #10b981; color: white; }
    button.no { background: #ef4444; color: white; }
    button:hover { opacity: 0.8; }
    .result {
      margin-top: 25px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sistem Pakar Ekstrakurikuler</h1>
    <div id="quiz">
      <p class="question" id="questionText"></p>
      <button class="yes" onclick="answer(true)">Ya</button>
      <button class="no" onclick="answer(false)">Tidak</button>
    </div>
    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    // Pertanyaan (basis pengetahuan sederhana)
    const questions = [
      { text: "Apakah kamu suka olahraga?", field: "olahraga" },
      { text: "Apakah kamu suka seni dan musik?", field: "seni" },
      { text: "Apakah kamu suka organisasi dan kepemimpinan?", field: "organisasi" },
      { text: "Apakah kamu suka teknologi dan komputer?", field: "teknologi" }
    ];

    // Jawaban user disimpan disini
    let answers = {};
    let currentQuestion = 0;

    const questionText = document.getElementById("questionText");
    const quiz = document.getElementById("quiz");
    const resultDiv = document.getElementById("result");

    // Tampilkan pertanyaan pertama
    function showQuestion() {
      if (currentQuestion < questions.length) {
        questionText.textContent = questions[currentQuestion].text;
      } else {
        showResult();
      }
    }

    // Simpan jawaban
    function answer(isYes) {
      let field = questions[currentQuestion].field;
      answers[field] = isYes;
      currentQuestion++;
      showQuestion();
    }

    // Proses hasil (aturan forward chaining sederhana)
    function showResult() {
      quiz.style.display = "none";
      let rekomendasi = "Ekstrakurikuler yang cocok untukmu adalah: ";

      if (answers.olahraga) {
        rekomendasi += "Olahraga (Futsal, Basket, dll)";
      } else if (answers.seni) {
        rekomendasi += "Seni & Musik (Paduan Suara, Band, Tari)";
      } else if (answers.organisasi) {
        rekomendasi += "OSIS / Pramuka / Paskibra";
      } else if (answers.teknologi) {
        rekomendasi += "Teknologi (Programming Club, Robotik)";
      } else {
        rekomendasi = "Kamu bisa mencoba berbagai ekstrakurikuler untuk menemukan minatmu 😊";
      }

      resultDiv.textContent = rekomendasi;
      resultDiv.style.display = "block";
    }

    // Mulai quiz
    showQuestion();
  </script>
</body>
</html>
